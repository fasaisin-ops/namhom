<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>รายการสั่งซื้อ — Body Scent</title>
  <link rel="stylesheet" href="style.css">
  <style>
    .page-title {
      font-size: clamp(2rem, 5vw, 3rem);
      font-weight: 400;
    }

    .table-wrap {
      overflow-x: auto;
      border: 1px solid var(--line);
      background: var(--white);
    }

    #ordersTable {
      width: 100%;
      min-width: 780px;
      border-collapse: collapse;
      font-size: 0.92rem;
    }
    #ordersTable th,
    #ordersTable td {
      padding: 1rem 1.25rem;
      border-bottom: 1px solid var(--line);
      text-align: left;
      vertical-align: top;
      line-height: 1.7;
    }
    #ordersTable th {
      background: var(--cream);
      font-weight: 400;
      color: var(--beige-dark);
      white-space: nowrap;
    }
    #ordersTable td:first-child { white-space: nowrap; }
    #ordersTable tbody tr:last-child td { border-bottom: 0; }

    .site-footer .brand { font-size: 1.2rem; }
  </style>
</head>
<body>

  <header class="site-header">
    <div class="container">
      <a class="brand" href="index.html">Body Scent</a>
    </div>
  </header>

  <main>
    <section class="section">
      <div class="container">
        <div class="section-head text-center">
          <h1 class="page-title title-rule">รายการสั่งซื้อ</h1>
          <p>แสดงรายการล่าสุดไว้ด้านบน</p>
        </div>

        <div class="table-wrap">
          <table id="ordersTable">
            <thead>
              <tr>
                <th>วันเวลา</th>
                <th>ชื่อลูกค้า</th>
                <th>เบอร์โทร / Line</th>
                <th>รายการสินค้า</th>
                <th>จำนวนเงินรวม</th>
                <th>หมายเหตุ</th>
              </tr>
            </thead>
            <tbody></tbody>
          </table>
        </div>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <div class="container">
      <span class="brand">Body Scent</span>
      <span>© 2026 Body Scent สงวนลิขสิทธิ์</span>
    </div>
  </footer>

  <script src="script.js"></script>
</body>
</html>
