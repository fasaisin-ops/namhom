<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>สั่งซื้อสินค้า — Body Scent</title>
  <link rel="stylesheet" href="style.css">
  <style>
    .page-title {
      font-size: clamp(2rem, 5vw, 3rem);
      font-weight: 400;
    }
    .order-container { max-width: 560px; }
    .order-form .btn {
      width: 100%;
      margin-top: var(--space-3);
    }
    .order-hint {
      margin: var(--space-3) auto 0;
      font-size: 0.88rem;
      text-align: center;
    }
    .order-hint a {
      border-bottom: 1px solid var(--line-dark);
    }
    .site-footer .brand { font-size: 1.2rem; }
  </style>
</head>
<body>

  <header class="site-header">
    <div class="container">
      <a class="brand" href="index.html">Body Scent</a>
      <nav class="nav" aria-label="เมนูหลัก">
        <a href="index.html">หน้าแรก</a>
        <a href="product.html">สินค้า</a>
      </nav>
    </div>
  </header>

  <main>
    <section class="section">
      <div class="container order-container">
        <div class="section-head text-center">
          <h1 class="page-title title-rule">สั่งซื้อสินค้า</h1>
          <p>กรอกข้อมูลด้านล่างเพื่อยืนยันคำสั่งซื้อ</p>
        </div>

        <form id="orderForm" class="order-form">
          <div class="form-group">
            <label for="customerName">ชื่อลูกค้า</label>
            <input type="text" id="customerName" name="customerName" autocomplete="name" required>
          </div>

          <div class="form-group">
            <label for="contact">เบอร์โทร / Line</label>
            <input type="text" id="contact" name="contact" autocomplete="off" required>
          </div>

          <div class="form-group">
            <label for="items">รายการสินค้า</label>
            <input type="text" id="items" name="items" required>
          </div>

          <div class="form-group">
            <label for="total">จำนวนเงินรวม (บาท)</label>
            <input type="number" id="total" name="total" min="0" step="any" inputmode="decimal" required>
          </div>

          <div class="form-group">
            <label for="note">หมายเหตุ</label>
            <textarea id="note" name="note"></textarea>
          </div>

          <button type="submit" class="btn btn--solid">ยืนยันสั่งซื้อ</button>
        </form>

        <p class="order-hint">ยังไม่ได้เลือกสินค้า? <a href="product.html">ดูสินค้าทั้งหมด</a></p>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <div class="container">
      <span class="brand">Body Scent</span>
      <span>© 2026 Body Scent สงวนลิขสิทธิ์</span>
    </div>
  </footer>

  <script src="script.js"></script>
</body>
</html>
